project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - examples/
  pre-render: home/build-data.lua
  resources:
    - home/gallery.json
    - home/js/
    - brand/js/

execute:
  freeze: auto

website:
  title: "EpiModel Gallery"
  description: "Template examples for extending EpiModel to model infectious disease dynamics over networks"
  favicon: brand/mark.svg
  navbar:
    background: dark
    logo: brand/mark.svg
    logo-alt: "EpiModel logo"
    left:
      - text: Gallery
        href: index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/EpiModel/EpiModel-Gallery
      - text: EpiModel
        href: https://www.epimodel.org/

  sidebar:
    style: docked
    search: true
    border: true
    collapse-level: 1
    contents:
      - section: Fundamentals
        contents:
          - examples/seir-exposed-state/index.qmd
          - examples/si-vital-dynamics/index.qmd
      - section: Interventions
        contents:
          - examples/seir-aon-vaccination/index.qmd
          - examples/seirs-leaky-vaccination/index.qmd
          - examples/sis-test-and-treat/index.qmd
          - examples/sir-time-varying-vaccination/index.qmd
          - examples/seir-contact-tracing/index.qmd
          - examples/sis-partner-notification/index.qmd
      - section: Intermediate Extensions
        contents:
          - examples/sis-competing-strains/index.qmd
          - examples/social-diffusion/index.qmd
          - examples/behavioral-risk-compensation/index.qmd
          - examples/rabies-raccoon-network/index.qmd
      - section: Full Disease Models
        contents:
          - examples/hiv/index.qmd
          - examples/syphilis/index.qmd
          - examples/rsv/index.qmd
          - examples/tuberculosis/index.qmd
      - section: Advanced Extensions
        contents:
          - examples/cost-effectiveness/index.qmd

  page-footer:
    border: false
    background: dark
    left:
      - text: "© 2026 EpiModel Research Lab, Emory University"
    center:
      - text: "EpiModel"
        href: https://www.epimodel.org/
      - text: "Package Docs"
        href: https://epimodel.github.io/EpiModel
      - text: "Training"
        href: https://epimodel.github.io/sismid/
      - text: "MIT License"
        href: https://github.com/EpiModel/EpiModel-Gallery/blob/main/LICENSE
    right:
      - icon: github
        href: https://github.com/EpiModel/EpiModel-Gallery

format:
  html:
    theme: [cosmo, brand/_brand.scss, styles/_theme.scss]
    css: brand/brand.css
    grid:
      sidebar-width: 300px
      body-width: 1000px
      margin-width: 200px
      gutter-width: 1rem
    toc: true
    toc-location: left
    toc-expand: false
    code-copy: true
    code-overflow: wrap
    code-tools: true
