on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

name: Test-Gallery-Models

jobs:
  pinned:
    name: renv-pinned (CRAN EpiModel per renv.lock)
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # TEMPORARY: the rabies-raccoon-network example needs netcensus(), which
      # is in EpiModel/EpiModel#1084 (branch netcensus) and not yet on CRAN.
      # Install that branch over the pinned CRAN release. Remove this step,
      # and bump renv.lock, once EpiModel >= 2.6.3 is on CRAN.
      - name: Install development EpiModel (temporary, remove before merge)
        run: Rscript -e 'renv::install("EpiModel/EpiModel@netcensus", prompt = FALSE)'

      - name: Check Gallery Examples
        run: bash test.sh

  cran-latest:
    name: cran-latest (EpiModel from CRAN)
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Bypass the project .Rprofile so renv does not activate and
      # override the CRAN install from setup-r-dependencies.
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      # TEMPORARY: see the note in the pinned job. Remove this step once
      # EpiModel >= 2.6.3 is on CRAN.
      - name: Install development EpiModel (temporary, remove before merge)
        run: |
          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_github("EpiModel/EpiModel", ref = "netcensus", upgrade = "never")'

      - name: Check Gallery Examples
        run: bash test.sh
