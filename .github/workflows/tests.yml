on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

name: Test-Gallery-Models

jobs:
  pinned:
    name: renv-pinned (CRAN EpiModel per renv.lock)
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # TEMPORARY: the RSV example needs netclique() and sample_groups(),
      # which are in EpiModel/EpiModel#1083 (branch netstatic) and not yet
      # on CRAN. The netcensus branch is stacked on netstatic and carries
      # both. Remove this step, and bump renv.lock, once those functions are
      # in a CRAN release.
      - name: Install development EpiModel (temporary, remove before merge)
        run: Rscript -e 'renv::install("EpiModel/EpiModel@netcensus", prompt = FALSE)'

      - name: Check Gallery Examples
        run: bash test.sh

  cran-latest:
    name: cran-latest (EpiModel from CRAN)
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Bypass the project .Rprofile so renv does not activate and
      # override the CRAN install from setup-r-dependencies.
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      # TEMPORARY: see the note in the pinned job. Remove this step once
      # netclique() and sample_groups() are in a CRAN release of EpiModel.
      - name: Install development EpiModel (temporary, remove before merge)
        run: |
          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_github("EpiModel/EpiModel", ref = "netcensus", upgrade = "never")'

      - name: Check Gallery Examples
        run: bash test.sh
